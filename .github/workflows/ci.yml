name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One concurrent run per ref; cancel in-flight runs on new pushes.
# PR runs are isolated by head ref; main runs share the "pages" key so
# only the latest push deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: install, typecheck, test with coverage, build ──────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite with coverage
        run: npm run test:cov

      - name: Build web app
        run: npm run build:web

      - name: Verify self-contained offline build
        run: |
          test -f dist/web/index.html
          test "$(find dist/web -maxdepth 1 -type f | wc -l)" -eq 1
          ! grep -Eq '<script[^>]+src=|<link[^>]+rel="stylesheet"|fetch\(|new[[:space:]]+XMLHttpRequest|new[[:space:]]+WebSocket' dist/web/index.html

      - name: Demo (builds CLI and runs it)
        run: npm run demo

  # ── Job 2: build static app and deploy to GitHub Pages ─────────────────────
  # Requires the repository Pages source to be set to "GitHub Actions" in
  # Settings → Pages before the first deploy.
  deploy:
    name: Deploy to Pages
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    # Serialise deploys; do not cancel an in-flight deploy when a new push
    # arrives — let the in-flight run finish so Pages is never left in a
    # partially-deployed state.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        # build:web = vite build → dist/web/
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match the `outDir` set in vite.config.ts (dist/web/).
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
